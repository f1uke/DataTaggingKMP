name: Release XCFramework

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build XCFramework
        run: ./gradlew :shared:assembleXCFramework

      - name: Create zip
        run: |
          cd shared/build/XCFrameworks
          zip -r DataTaggingKMP.xcframework.zip DataTaggingKMP.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum shared/build/XCFrameworks/DataTaggingKMP.xcframework.zip)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: $CHECKSUM"

      - name: Generate release notes with AI
        id: release_notes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Generate release notes for version ${{ github.ref_name }} of this repository.

            Run these commands to get the changes:
            1. git fetch --tags
            2. Find the previous tag: git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n 1
            3. Get commits between the previous tag and ${{ github.ref_name }}
            4. Get the diff between the previous tag and ${{ github.ref_name }}

            Then write concise, clear release notes in markdown:
            - A brief summary of what changed
            - Bullet points for each notable change
            - Keep it professional and to the point
            - Write in English
            - Do NOT include a title/header (the GitHub release already shows the version)
            - Ignore commits like "Update Package.swift" or merge commits — focus on actual code changes
            - Output ONLY the release notes markdown, nothing else

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: shared/build/XCFrameworks/DataTaggingKMP.xcframework.zip
          body: ${{ steps.release_notes.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Package.swift
        run: |
          VERSION=${{ github.ref_name }}
          CHECKSUM=${{ steps.checksum.outputs.checksum }}
          REPO=${{ github.repository }}

          cat > Package.swift << EOF
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "DataTaggingKMP",
              platforms: [
                  .iOS(.v13)
              ],
              products: [
                  .library(
                      name: "DataTaggingKMP",
                      targets: ["DataTaggingKMP"]
                  )
              ],
              targets: [
                  .binaryTarget(
                      name: "DataTaggingKMP",
                      url: "https://github.com/${REPO}/releases/download/${VERSION}/DataTaggingKMP.xcframework.zip",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

      - name: Commit updated Package.swift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Update Package.swift for release ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:main
